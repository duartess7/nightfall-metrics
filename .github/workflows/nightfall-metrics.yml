name: Refresh Nightfall metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/nightfall_metrics.py"
      - "scripts/language_spectrum.py"
      - "scripts/duo_metrics.py"
      - ".github/workflows/nightfall-metrics.yml"

permissions:
  contents: write

concurrency:
  group: nightfall-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate custom telemetry cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/nightfall_metrics.py --username duartess7 --output metrics/nightfall.svg
          python scripts/language_spectrum.py --username duartess7 --output metrics/languages.svg
          python scripts/duo_metrics.py --username duartess7 --output metrics/overview.svg
      - name: Publish refreshed metrics
        run: |
          git config user.name "duartess7"
          git config user.email "128036983+duartess7@users.noreply.github.com"
          git add metrics/nightfall.svg metrics/languages.svg metrics/overview.svg
          git diff --cached --quiet || git commit -m "chore: refresh Nightfall metrics"
          git push
